services:
  # Kafka broker (deployment)
  kafka:
    environment:
      # External clients connect to the public DNS.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://alfie.iti.gr:9092

  # Data Warehouse API (deployment behind reverse proxy at /autodw)
  api:
    environment:
      ROOT_PATH: /autodw
      # Production Mongo/GraphDB already populated — auto-seed skips when data exists;
      # disable anyway so an empty collection never imports the partner seed snapshot.
      ETD_HUB_AUTO_SEED: "false"
      GRAPHDB_AUTO_SEED: "false"

  # Consumers use in-stack Kafka + talk to DW API over the docker network.
  bias-detector:
    environment:
      API_BASE: http://api:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  # AutoML workers must use kafka_automl_consumer_example_v5.py (see base compose)
  # and the unified engine paths: /automl/tabular/... and /automl/vision/...
  automl-consumer:
    environment:
      API_BASE: http://api:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTOML_ENGINE_HOST: host.docker.internal
      AUTOML_ENGINE_PORT: "8001"
      TABULAR_AUTOML_HOST: host.docker.internal
      TABULAR_AUTOML_PORT: "8001"
      VISION_AUTOML_HOST: host.docker.internal
      VISION_AUTOML_PORT: "8001"

  # Replica workers (docker-compose.automl-consumer-replicas.yml) — same unified engine.
  automl-consumer-1: &automl_deploy_env
    environment:
      API_BASE: http://api:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTOML_ENGINE_HOST: host.docker.internal
      AUTOML_ENGINE_PORT: "8001"
      TABULAR_AUTOML_HOST: host.docker.internal
      TABULAR_AUTOML_PORT: "8001"
      VISION_AUTOML_HOST: host.docker.internal
      VISION_AUTOML_PORT: "8001"
  automl-consumer-2:
    <<: *automl_deploy_env
  automl-consumer-3:
    <<: *automl_deploy_env

  # If you later run xai-consumer in this stack, keep it consistent too.
  # xai-consumer:
  #   environment:
  #     API_BASE: http://api:8000
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092

