name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: gitlab.catalink.eu:5050
  # MODULE=autodw under the shared alfie registry project (per ALFIE integration guidelines)
  IMAGE_PREFIX: gitlab.catalink.eu:5050/external/alfie_eu/alfie/autodw

jobs:
  build-push:
    name: Build and Push autodw
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # ubuntu-latest keeps several GB of unused SDKs. The AutoGluon/torch
      # image is ~10 GB; exporting it with a full disk sits on "exporting layers".
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 only: the deploy hosts are x86_64. arm64 is built under QEMU and
      # the second copy is what makes "exporting layers" hang for over an hour.
      # provenance/sbom off: BuildKit attestation export hangs on this image size.
      - name: Build and push autodw
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}:latest
